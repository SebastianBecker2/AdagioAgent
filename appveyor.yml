# AppVeyor CI configuration for AdagioAgent
# Builds on Windows (Visual Studio 2022 image) to support:
#   • machine-agent  — .NET 8 / FlaUI / WiX MSI installer
#   • controller-extension — TypeScript / VS Code extension

image: Visual Studio 2022

# ── Environment ──────────────────────────────────────────────────────────────
environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# ── Node.js version ──────────────────────────────────────────────────────────
# VS 2022 image ships with multiple Node versions; select a stable LTS release.
install:
  - ps: Install-Product node 22

# ── Build ─────────────────────────────────────────────────────────────────────
# Disable the default MSBuild step; we drive everything through build_script.
build: off

build_script:
  # 0.1 Ensure README/SUPPORT markdown links resolve to existing workspace files
  - ps: .\scripts\check-doc-links.ps1

  # 0.12 Ensure README operational docs index includes required runbook/schema docs
  - ps: .\scripts\check-operational-docs-index.ps1

  # 0.15 Ensure observability docs mention required core fields and policy tokens
  - ps: .\scripts\check-observability-docs.ps1

  # 0. Preflight release trust checks (versions, governance docs, tag/changelog rules)
  - ps: .\scripts\release-preflight.ps1 -Ci

  # 0.2 Generate and validate offline support bundle manifest shape
  - ps: |
      $bundleRoot = Join-Path $env:TEMP 'adagio-support-bundles-ci'
      .\scripts\collect-support-bundle.ps1 -Offline -OutputRoot $bundleRoot
      $latestBundle = Get-ChildItem $bundleRoot -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
      if (-not $latestBundle) { throw 'No support bundle directory was generated.' }
      .\scripts\validate-support-bundle.ps1 -BundlePath $latestBundle.FullName -ExpectOffline

  # 1. Restore & build the .NET machine-agent (Release)
  - dotnet restore machine-agent\AdagioMachineAgent.csproj
  - dotnet build machine-agent\AdagioMachineAgent.csproj -c Release --no-restore

  # 2. Install Node dependencies and compile the VS Code extension
  - cd controller-extension
  - npm ci
  - npm i --no-save @rolldown/binding-win32-x64-msvc
  - npm run compile
  - cd ..

  # 3. Build the WiX MSI installer (also publishes the machine-agent internally)
  - dotnet build installer/AdagioMachineAgent.Setup.wixproj -p:Configuration=Release

# ── Tests ────────────────────────────────────────────────────────────────────
test_script:
  # 1. Run .NET unit tests (machine-agent-tests project is part of the solution)
  - dotnet test AdagioAgent.sln -c Release --logger "trx;LogFileName=dotnet-tests.trx" --results-directory .\TestResults

  # 2. Run VS Code extension unit tests
  - cd controller-extension
  - if not exist test-results mkdir test-results
  - npm test -- --reporter=default --reporter=junit --outputFile=.\test-results\vitest-junit.xml
  - cd ..

# ── Artifacts ────────────────────────────────────────────────────────────────
artifacts:
  - path: installer/bin/x64/Release/AdagioMachineAgentSetup.msi
    name: AdagioMachineAgentSetup
  - path: TestResults/**/*.trx
    name: DotNetTestResults
  - path: controller-extension/test-results/*.xml
    name: ExtensionTestResults

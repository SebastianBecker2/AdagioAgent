# AppVeyor CI configuration for AdagioAgent
# Builds on Windows (Visual Studio 2022 image) to support:
#   • machine-agent  — .NET 8 / FlaUI / WiX MSI installer
#   • controller-extension — TypeScript / VS Code extension

image: Visual Studio 2022

# ── Environment ──────────────────────────────────────────────────────────────
environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# ── Node.js version ──────────────────────────────────────────────────────────
# VS 2022 image ships with multiple Node versions; select a stable LTS release.
install:
  - ps: Install-Product node 22

# ── Build ─────────────────────────────────────────────────────────────────────
# Disable the default MSBuild step; we drive everything through build_script.
build: off

build_script:
  # 0.1 Ensure README/SUPPORT markdown links resolve to existing workspace files
  - ps: .\scripts\check-doc-links.ps1

  # 0.12 Ensure README operational docs index includes required runbook/schema docs
  - ps: .\scripts\check-operational-docs-index.ps1

  # 0.15 Ensure observability docs mention required core fields and policy tokens
  - ps: .\scripts\check-observability-docs.ps1

  # 0. Preflight release trust checks (versions, governance docs, tag/changelog rules)
  - ps: .\scripts\release-preflight.ps1 -Ci

  # 0.05 On tagged builds, ensure changelog references matching release sign-off record
  - ps: .\scripts\check-release-signoff-reference.ps1

  # 0.06 On tagged builds, validate sign-off evidence path/URI policy
  - ps: .\scripts\check-signoff-evidence-references.ps1

  # 0.07 On tagged builds, require evidence index reference and cross-link
  - ps: .\scripts\check-signoff-evidence-index-reference.ps1

  # 0.08 On tagged builds, validate evidence index content integrity
  - ps: .\scripts\check-evidence-index-content.ps1

  # 0.085 On tagged builds, emit release-ops readiness summary verdict
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        $readinessRoot = '.\artifacts\release-ops-tag-readiness'
        .\scripts\generate-release-ops-tag-readiness-summary.ps1 -OutputDir $readinessRoot -FailOnHold
        .\scripts\update-release-ops-tag-readiness-history.ps1 -ReadinessRoot $readinessRoot -ArchiveLatest -MaxEntries 20 -RetentionDays 180
      }
      else {
        Write-Host 'Release-ops tag readiness summary skipped on non-tag build.'
      }

  # 0.086 On tagged builds, enforce promotion trend thresholds from readiness history
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        $readinessRoot = '.\artifacts\release-ops-tag-readiness'
        $gateError = $null
        try {
          .\scripts\check-release-ops-promotion-gate.ps1 -ReadinessRoot $readinessRoot -FailOnBlock
        }
        catch {
          $gateError = $_
          Write-Host "Promotion gate failed: $($_.Exception.Message)"
        }
        finally {
          .\scripts\update-release-ops-promotion-gate-trend.ps1 -ReadinessRoot $readinessRoot -ArchiveLatest -MaxEntries 20 -RetentionDays 365
        }

        if ($gateError) {
          throw $gateError.Exception
        }
      }
      else {
        Write-Host 'Release-ops promotion gate skipped on non-tag build.'
      }

  # 0.087 On tagged builds, generate closure package manifest linking release artifacts
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        $readinessRoot = '.\artifacts\release-ops-tag-readiness'
        .\scripts\generate-release-ops-closure-package-manifest.ps1 -ReadinessRoot $readinessRoot -OutputDir $readinessRoot
      }
      else {
        Write-Host 'Release-ops closure package manifest skipped on non-tag build.'
      }

  # 0.088 On tagged builds, validate closure package manifest completeness
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        $readinessRoot = '.\artifacts\release-ops-tag-readiness'
        .\scripts\check-release-ops-closure-package-manifest.ps1 -ReadinessRoot $readinessRoot
      }
      else {
        Write-Host 'Release-ops closure package manifest validation skipped on non-tag build.'
      }

  # 0.089 On tagged builds, detect closure manifest drift against current outputs
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        $readinessRoot = '.\artifacts\release-ops-tag-readiness'
        .\scripts\check-release-ops-closure-package-drift.ps1 -ReadinessRoot $readinessRoot
      }
      else {
        Write-Host 'Release-ops closure package drift check skipped on non-tag build.'
      }

  # 0.0895 On tagged builds, emit closure package integrity report with artifact hashes
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        $readinessRoot = '.\artifacts\release-ops-tag-readiness'
        .\scripts\generate-release-ops-closure-package-integrity-report.ps1 -ReadinessRoot $readinessRoot -OutputDir $readinessRoot
      }
      else {
        Write-Host 'Release-ops closure package integrity report skipped on non-tag build.'
      }

  # 0.09 Run validator script tests (Pester)
  - ps: Invoke-Pester -Script .\scripts\tests\ValidatorScripts.Tests.ps1 -EnableExit

  # 0.095 Run dry-run script tests (Pester)
  - ps: Invoke-Pester -Script .\scripts\tests\DryRunScripts.Tests.ps1 -EnableExit

  # 0.10 On non-tag builds, smoke-test dry-run release-ops package generation
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        Write-Host 'Dry-run release-ops smoke check skipped on tagged build.'
      }
      else {
        $dryRunRoot = Join-Path $env:TEMP 'adagio-release-ops-dryrun-ci'
        $diagnosticsRoot = '.\artifacts\release-ops-dryrun-diagnostics'
        New-Item -ItemType Directory -Path $diagnosticsRoot -Force | Out-Null
        .\scripts\prune-release-ops-dryrun-diagnostics.ps1 -DiagnosticsRoot $diagnosticsRoot -RetentionDays 14
        $timestamp = [DateTime]::UtcNow.ToString('yyyyMMddHHmmss')
        $summaryPath = Join-Path $diagnosticsRoot "dryrun-validation-summary-$timestamp.json"

        try {
          .\scripts\generate-release-ops-dry-run.ps1 -OutputRoot $dryRunRoot -Force
          $latest = Get-ChildItem -LiteralPath $dryRunRoot -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest) { throw 'Dry-run package generation produced no output directory.' }
          .\scripts\validate-release-ops-dry-run.ps1 -PackagePath $latest.FullName -SummaryOutputPath $summaryPath

          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          $summary | Add-Member -NotePropertyName buildMetadata -NotePropertyValue @{
            provider = 'appveyor'
            buildId = $env:APPVEYOR_BUILD_ID
            buildNumber = $env:APPVEYOR_BUILD_NUMBER
            buildVersion = $env:APPVEYOR_BUILD_VERSION
            commit = $env:APPVEYOR_REPO_COMMIT
            branch = $env:APPVEYOR_REPO_BRANCH
            repoTag = $env:APPVEYOR_REPO_TAG
          } -Force

          $successSummaryPath = Join-Path $diagnosticsRoot "dryrun-validation-summary-success-$timestamp.json"
          $summary | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $successSummaryPath -Encoding UTF8
          Copy-Item -LiteralPath $successSummaryPath -Destination (Join-Path $diagnosticsRoot 'dryrun-validation-summary-latest-success.json') -Force
          Remove-Item -LiteralPath $summaryPath -Force -ErrorAction SilentlyContinue

          Remove-Item -LiteralPath $dryRunRoot -Recurse -Force
        }
        catch {
          $failedSummaryPath = Join-Path $diagnosticsRoot "dryrun-validation-summary-failure-$timestamp.json"
          if (Test-Path -LiteralPath $summaryPath -PathType Leaf) {
            Move-Item -LiteralPath $summaryPath -Destination $failedSummaryPath -Force
            $summaryPath = $failedSummaryPath
          }

          if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) {
            @{
              generatedAtUtc = [DateTimeOffset]::UtcNow.ToString('u')
              success = $false
              error = $_.Exception.Message
              buildMetadata = @{
                provider = 'appveyor'
                buildId = $env:APPVEYOR_BUILD_ID
                buildNumber = $env:APPVEYOR_BUILD_NUMBER
                buildVersion = $env:APPVEYOR_BUILD_VERSION
                commit = $env:APPVEYOR_REPO_COMMIT
                branch = $env:APPVEYOR_REPO_BRANCH
                repoTag = $env:APPVEYOR_REPO_TAG
              }
            } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $summaryPath -Encoding UTF8
          }

          Write-Host "Dry-run diagnostics summary captured at: $summaryPath"
          throw
        }
        finally {
          .\scripts\update-release-ops-diagnostics-index.ps1 -DiagnosticsRoot $diagnosticsRoot -MaxEntries 20
        }
      }

  # 0.105 On non-tag builds, assert diagnostics index was refreshed after dry-run
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        Write-Host 'Diagnostics index freshness check skipped on tagged build.'
      }
      else {
        $diagnosticsRoot = '.\artifacts\release-ops-dryrun-diagnostics'
        .\scripts\check-release-ops-diagnostics-index-freshness.ps1 -DiagnosticsRoot $diagnosticsRoot
      }

  # 0.106 On non-tag builds, generate and publish CI status report from diagnostics index
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        Write-Host 'CI status report generation skipped on tagged build.'
      }
      else {
        $diagnosticsRoot = '.\artifacts\release-ops-dryrun-diagnostics'
        .\scripts\generate-release-ops-ci-status-report.ps1 -DiagnosticsRoot $diagnosticsRoot -OutputDir $diagnosticsRoot
      }

  # 0.2 Generate and validate offline support bundle manifest shape
  - ps: |
      $bundleRoot = Join-Path $env:TEMP 'adagio-support-bundles-ci'
      .\scripts\collect-support-bundle.ps1 -Offline -OutputRoot $bundleRoot
      $latestBundle = Get-ChildItem $bundleRoot -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
      if (-not $latestBundle) { throw 'No support bundle directory was generated.' }
      .\scripts\validate-support-bundle.ps1 -BundlePath $latestBundle.FullName -ExpectOffline

  # 1. Restore & build the .NET machine-agent (Release)
  - dotnet restore machine-agent\AdagioMachineAgent.csproj
  - dotnet build machine-agent\AdagioMachineAgent.csproj -c Release --no-restore

  # 2. Install Node dependencies and compile the VS Code extension
  - cd controller-extension
  - npm ci
  - npm i --no-save @rolldown/binding-win32-x64-msvc
  - npm run compile
  - cd ..

  # 3. Build the WiX MSI installer (also publishes the machine-agent internally)
  - dotnet build installer/AdagioMachineAgent.Setup.wixproj -p:Configuration=Release

# ── Tests ────────────────────────────────────────────────────────────────────
test_script:
  # 1. Run .NET unit tests (machine-agent-tests project is part of the solution)
  - dotnet test AdagioAgent.sln -c Release --logger "trx;LogFileName=dotnet-tests.trx" --results-directory .\TestResults

  # 2. Run VS Code extension unit tests
  - cd controller-extension
  - if not exist test-results mkdir test-results
  - npm test -- --reporter=default --reporter=junit --outputFile=.\test-results\vitest-junit.xml
  - cd ..

# ── Artifacts ────────────────────────────────────────────────────────────────
artifacts:
  - path: installer/bin/x64/Release/AdagioMachineAgentSetup.msi
    name: AdagioMachineAgentSetup
  - path: artifacts/release-ops-dryrun-diagnostics/*.json
    name: DryRunValidationDiagnostics
  - path: artifacts/release-ops-dryrun-diagnostics/*.md
    name: DryRunValidationDiagnosticsMarkdown
  - path: artifacts/release-ops-dryrun-diagnostics/release-ops-ci-status-report.json
    name: ReleaseOpsCiStatusReport
  - path: artifacts/release-ops-dryrun-diagnostics/release-ops-ci-status-report.md
    name: ReleaseOpsCiStatusReportMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-tag-readiness-summary.json
    name: ReleaseOpsTagReadinessSummary
  - path: artifacts/release-ops-tag-readiness/release-ops-tag-readiness-summary.md
    name: ReleaseOpsTagReadinessSummaryMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-tag-readiness-history-index.json
    name: ReleaseOpsTagReadinessHistoryIndex
  - path: artifacts/release-ops-tag-readiness/release-ops-tag-readiness-history-index.md
    name: ReleaseOpsTagReadinessHistoryIndexMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-tag-readiness-summary-*.json
    name: ReleaseOpsTagReadinessSummaryArchive
  - path: artifacts/release-ops-tag-readiness/release-ops-tag-readiness-summary-*.md
    name: ReleaseOpsTagReadinessSummaryArchiveMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-promotion-gate-report.json
    name: ReleaseOpsPromotionGateReport
  - path: artifacts/release-ops-tag-readiness/release-ops-promotion-gate-report.md
    name: ReleaseOpsPromotionGateReportMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-promotion-gate-trend-index.json
    name: ReleaseOpsPromotionGateTrendIndex
  - path: artifacts/release-ops-tag-readiness/release-ops-promotion-gate-trend-index.md
    name: ReleaseOpsPromotionGateTrendIndexMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-promotion-gate-report-*.json
    name: ReleaseOpsPromotionGateReportArchive
  - path: artifacts/release-ops-tag-readiness/release-ops-promotion-gate-report-*.md
    name: ReleaseOpsPromotionGateReportArchiveMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-closure-package-manifest.json
    name: ReleaseOpsClosurePackageManifest
  - path: artifacts/release-ops-tag-readiness/release-ops-closure-package-manifest.md
    name: ReleaseOpsClosurePackageManifestMarkdown
  - path: artifacts/release-ops-tag-readiness/release-ops-closure-package-integrity-report.json
    name: ReleaseOpsClosurePackageIntegrityReport
  - path: artifacts/release-ops-tag-readiness/release-ops-closure-package-integrity-report.md
    name: ReleaseOpsClosurePackageIntegrityReportMarkdown
  - path: TestResults/**/*.trx
    name: DotNetTestResults
  - path: controller-extension/test-results/*.xml
    name: ExtensionTestResults

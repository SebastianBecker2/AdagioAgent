name: Dependency Health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-dependency-health:
    name: NPM dependency health (controller-extension)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect npm dependency health signals
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $reportDir = "artifacts/dependency-health"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          Push-Location "controller-extension"
          try {
            Write-Host "Running npm ci (capturing warnings)..."
            npm ci 2>&1 | Tee-Object -FilePath "../$reportDir/npm-ci.log"
            if ($LASTEXITCODE -ne 0) {
              throw "npm ci failed with exit code $LASTEXITCODE"
            }

            Write-Host "Collecting npm outdated data..."
            npm outdated --json > "../$reportDir/npm-outdated.json"
            $outdatedExit = $LASTEXITCODE
            if ($outdatedExit -gt 1) {
              throw "npm outdated failed with exit code $outdatedExit"
            }

            Write-Host "Collecting npm audit data..."
            npm audit --json > "../$reportDir/npm-audit.json"
            $auditExit = $LASTEXITCODE
            if ($auditExit -gt 1) {
              throw "npm audit failed with exit code $auditExit"
            }

            Write-Host "Collecting direct dependency versions..."
            npm ls --depth=0 --json > "../$reportDir/npm-direct-deps.json"
            if ($LASTEXITCODE -ne 0) {
              throw "npm ls --depth=0 failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          $installLogPath = Join-Path $reportDir "npm-ci.log"
          $deprecatedLines = @()
          if (Test-Path -LiteralPath $installLogPath -PathType Leaf) {
            $deprecatedLines = Select-String -Path $installLogPath -Pattern "npm warn deprecated" | ForEach-Object { $_.Line }
          }

          $summaryPath = Join-Path $reportDir "dependency-health-summary.md"
          $outdatedPath = Join-Path $reportDir "npm-outdated.json"
          $auditPath = Join-Path $reportDir "npm-audit.json"

          $outdatedRaw = if (Test-Path -LiteralPath $outdatedPath -PathType Leaf) {
            Get-Content -LiteralPath $outdatedPath -Raw
          } else {
            ""
          }

          $outdatedObject = $null
          if (-not [string]::IsNullOrWhiteSpace($outdatedRaw)) {
            try {
              $outdatedObject = $outdatedRaw | ConvertFrom-Json
            }
            catch {
              $outdatedObject = $null
            }
          }
          $outdatedCount = if ($outdatedObject) { ($outdatedObject.PSObject.Properties | Measure-Object).Count } else { 0 }
          $outdatedDetails = @()
          if ($outdatedObject) {
            $outdatedDetails = $outdatedObject.PSObject.Properties |
              Sort-Object Name |
              ForEach-Object {
                $pkg = $_.Name
                $meta = $_.Value
                "- $pkg (current=$($meta.current), wanted=$($meta.wanted), latest=$($meta.latest), type=$($meta.type))"
              }
          }

          $auditRaw = if (Test-Path -LiteralPath $auditPath -PathType Leaf) {
            Get-Content -LiteralPath $auditPath -Raw
          } else {
            ""
          }

          $auditObject = $null
          if (-not [string]::IsNullOrWhiteSpace($auditRaw)) {
            try {
              $auditObject = $auditRaw | ConvertFrom-Json
            }
            catch {
              $auditObject = $null
            }
          }

          $auditVuln = $null
          if ($auditObject -and $auditObject.metadata -and $auditObject.metadata.vulnerabilities) {
            $auditVuln = $auditObject.metadata.vulnerabilities
          }

          $lines = @(
            "# Dependency Health Summary",
            "",
            "- GeneratedAtUtc: $([DateTimeOffset]::UtcNow.ToString('u'))",
            "- Deprecated install warnings: $($deprecatedLines.Count)",
            "- Outdated direct packages: $outdatedCount"
          )

          if ($auditVuln) {
            $lines += "- Audit vulnerabilities: info=$($auditVuln.info), low=$($auditVuln.low), moderate=$($auditVuln.moderate), high=$($auditVuln.high), critical=$($auditVuln.critical), total=$($auditVuln.total)"
          }

          if ($outdatedDetails.Count -gt 0) {
            $lines += ""
            $lines += "## Outdated direct packages"
            $lines += ""
            $lines += $outdatedDetails
          }

          if ($deprecatedLines.Count -gt 0) {
            $lines += ""
            $lines += "## Deprecated warnings (npm ci)"
            $lines += ""
            $lines += $deprecatedLines | Select-Object -First 200
          }

          Set-Content -LiteralPath $summaryPath -Value $lines -Encoding UTF8

      - name: Upload dependency health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health
          path: artifacts/dependency-health/*
          if-no-files-found: error
